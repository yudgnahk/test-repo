name: On tag creation event
on:
  push:
    tags:
      - 'alpha-*'
      - 'beta-*'
      - 'gamma-*'

jobs:
  call-reusable-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Set up tag
        id: extract
        run: |
          TAG="${{ github.ref_name }}"
          # Use regex to extract parts
          if [[ "$TAG" =~ ^([^-]+)-([^-]+)-(.+)$ ]]; then
            echo "MAJOR=${BASH_REMATCH[1]}" >> $GITHUB_ENV
            echo "MINOR=${BASH_REMATCH[2]}" >> $GITHUB_ENV
            echo "VERSION=${BASH_REMATCH[3]}" >> $GITHUB_ENV
          else
            echo "Tag format is incorrect."
            exit 1
          fi
      
      - uses: actions/checkout@v4
      
      - name: Call reusable workflow
        uses: ./.github/workflows/reusable_workflow.yaml
        with:
          type: ${{ env.MAJOR }}
          environment: ${{ env.MINOR }}
